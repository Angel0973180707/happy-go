<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>何厝社區特色商品｜線上下單</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:#f7efe6;
  color:#4d3425;
}

.hero{
  background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),
  url("https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?q=80&w=1200&auto=format&fit=crop");
  background-size:cover;
  background-position:center;
  color:white;
  text-align:center;
  padding:70px 20px;
}

.hero h1{
  margin:0;
  font-size:38px;
  letter-spacing:3px;
}

.hero p{
  margin-top:14px;
  font-size:18px;
}

.wrap{
  max-width:980px;
  margin:auto;
  padding:24px 16px 80px;
}

.card{
  background:white;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.top-info{
  padding:28px 24px;
  background:#fff8f0;
  border-bottom:1px solid #ecd9c7;
}

.top-info h2{
  margin:0;
  color:#8a5a3b;
  font-size:28px;
}

.top-info p{
  margin:12px 0 0;
  line-height:1.9;
  color:#6d5848;
}

.notice{
  margin-top:18px;
  background:#fff2df;
  border:1px solid #e4c4a1;
  padding:16px;
  border-radius:16px;
  line-height:1.8;
}

iframe{
  width:100%;
  height:2600px;
  border:none;
  background:white;
}

.footer{
  text-align:center;
  padding:30px 20px 50px;
  color:#7d6757;
  line-height:1.9;
}

.footer strong{
  color:#8a5a3b;
}

@media(max-width:640px){

.hero{
  padding:56px 20px;
}

.hero h1{
  font-size:30px;
}

.top-info h2{
  font-size:24px;
}

iframe{
  height:2800px;
}

}

</style>
</head>

<body>

<div class="hero">
  <h1>何厝社區特色商品</h1>
  <p>金門在地風味｜手作點心｜特色番薯酒</p>
</div>

<div class="wrap">

  <div class="card">

    <div class="top-info">

      <h2>線上下單專區</h2>

      <p>
        歡迎選購何厝社區特色商品 ❤️<br>
        感受金門在地的人情味與古早風味。
      </p>

      <div class="notice">
        📌 取貨方式如選擇：<br>
        「其他（請備註填寫送貨地址）」<br>
        請於表單備註欄填寫完整送貨地址。
      </div>

    </div>

    <iframe
      src="https://docs.google.com/forms/d/e/1FAIpQLSe_RJWN0JZhs_9vIktkL6BqF2HAYhqEFY2Aoxs7hVzCfhjlug/viewform?embedded=true">
      載入中…
    </iframe>

  </div>

</div>

<div class="footer">
  <strong>金門縣金沙鎮何厝社區發展協會</strong><br>
  感謝您的支持與訂購 🌿
</div>

</body>
</html>
